blueprint:
  name: Aqara H2 EU double rocker (WS-K08E) via Zigbee2MQTT
  description: >
    Associe une action à chaque geste des 4 boutons de l'interrupteur
    Aqara H2 EU double rocker (WS-K08E), appairé via Zigbee2MQTT.

    - Boutons du haut (left / right) : simple clic uniquement.
    - Boutons du bas (left_down / right_down) : simple clic, double clic et maintien
      (le multi click doit être activé sur ces boutons).


    Conseil : passer les deux côtés en mode `decoupled` pour que les boutons
    du haut ne pilotent plus directement les relais. Si une ampoule connectée
    est câblée derrière, garder le relai allumé et activer `lock_relay`.
  domain: automation
  input:
    device_settings:
      name: Interrupteur
      icon: mdi:light-switch
      input:
        switch_device:
          name: Interrupteur Aqara H2
          description: L'interrupteur WS-K08E exposé par Zigbee2MQTT.
          selector:
            device:
              filter:
                - integration: mqtt
                  manufacturer: Aqara
                  model: Light switch H2 EU (double rocker)
        base_topic:
          name: Base topic MQTT
          description: Base topic de Zigbee2MQTT (par défaut zigbee2mqtt).
          default: zigbee2mqtt
          selector:
            text: {}

    section_left:
      name: Gauche (haut)
      icon: mdi:arrow-top-left
      collapsed: true
      input:
        single_left:
          name: Simple clic
          description: Les boutons du haut ne gèrent que le simple clic.
          default: []
          selector:
            action: {}

    section_left_down:
      name: Gauche (bas)
      icon: mdi:arrow-bottom-left
      collapsed: true
      input:
        single_left_down:
          name: Simple clic
          default: []
          selector:
            action: {}
        double_left_down:
          name: Double clic
          default: []
          selector:
            action: {}
        hold_left_down:
          name: Maintien
          default: []
          selector:
            action: {}

    section_right:
      name: Droite (haut)
      icon: mdi:arrow-top-right
      collapsed: true
      input:
        single_right:
          name: Simple clic
          description: Les boutons du haut ne gèrent que le simple clic.
          default: []
          selector:
            action: {}

    section_right_down:
      name: Droite (bas)
      icon: mdi:arrow-bottom-right
      collapsed: true
      input:
        single_right_down:
          name: Simple clic
          default: []
          selector:
            action: {}
        double_right_down:
          name: Double clic
          default: []
          selector:
            action: {}
        hold_right_down:
          name: Maintien
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  base_topic: !input base_topic

variables:
  switch_device: !input switch_device
  # Le nom du device côté HA correspond au friendly name Zigbee2MQTT
  # (même si tu le renommes dans l'UI de HA, ce champ ne change pas).
  z2m_name: "{{ device_attr(switch_device, 'name') }}"
  press: "{{ trigger.payload }}"

triggers:
  - trigger: mqtt
    topic: "{{ base_topic }}/+/action"

conditions:
  - condition: template
    value_template: >
      {{ trigger.topic == base_topic ~ '/' ~ z2m_name ~ '/action'
         and press not in ['', 'None'] }}

actions:
  - choose:
      # Gauche (haut)
      - conditions: "{{ press == 'single_left' }}"
        sequence: !input single_left
      # Gauche (bas)
      - conditions: "{{ press == 'single_left_down' }}"
        sequence: !input single_left_down
      - conditions: "{{ press == 'double_left_down' }}"
        sequence: !input double_left_down
      - conditions: "{{ press == 'hold_left_down' }}"
        sequence: !input hold_left_down
      # Droite (haut)
      - conditions: "{{ press == 'single_right' }}"
        sequence: !input single_right
      # Droite (bas)
      - conditions: "{{ press == 'single_right_down' }}"
        sequence: !input single_right_down
      - conditions: "{{ press == 'double_right_down' }}"
        sequence: !input double_right_down
      - conditions: "{{ press == 'hold_right_down' }}"
        sequence: !input hold_right_down
